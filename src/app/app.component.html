<!-- NAVBAR -->
<header class="navbar">
  <div class="nav-inner">
    <a routerLink="/" class="logo" (click)="closeMenu()">
      <span class="logo-icon">🐕</span>
      <span class="logo-text">Gassi Weg</span>
    </a>

    <button class="burger" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen" aria-label="Menü">
      <span></span><span></span><span></span>
    </button>

    <nav class="nav-links" [class.open]="menuOpen">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMenu()">Home</a>
      <a routerLink="/preise" routerLinkActive="active" (click)="closeMenu()">Preise</a>
      <a routerLink="/anfrage" routerLinkActive="active" (click)="closeMenu()">Anfrage</a>
      <a routerLink="/impressum" routerLinkActive="active" (click)="closeMenu()">Impressum</a>
      <a routerLink="/anfrage" class="btn btn-primary nav-cta" (click)="closeMenu()">Jetzt buchen</a>
    </nav>
  </div>
</header>

<main>
  <router-outlet />
</main>

<!-- FOOTER -->
<footer class="footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <span class="logo-text">Gassi Weg</span>
      <p>Zuverlässige Gassi-Runden mit Herz – von Finn, 18 Jahre.</p>
    </div>
    <div class="footer-links">
      <a routerLink="/preise">Preise</a>
      <a routerLink="/anfrage">Anfrage</a>
      <a routerLink="/impressum">Impressum</a>
    </div>
    <p class="footer-copy">© 2026 Gassi Weg · Made with ❤️ & Pop-Art</p>
  </div>
</footer>
